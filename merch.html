<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интернет-магазин — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 40px;">
    <h2>Интернет-магазин</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Символика, которая объединяет. Прибыль идет на развитие сообщества.</p>

    <div class="grid">
      <div class="card">
        <div style="height: 200px; background: #222; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; color: #555;">Фото</div>
        <h3>Футболка ГАРТ</h3>
        <p style="color: var(--accent); font-weight: bold; margin: 10px 0;">2 500 ₽</p>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Черная, хлопок 100%.</p>
        <button class="btn" style="width: 100%;" onclick="buyItem('Футболка ГАРТ')">Купить</button>
      </div>

      <div class="card">
        <div style="height: 200px; background: #222; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; color: #555;">Фото</div>
        <h3>Худи ГАРТ</h3>
        <p style="color: var(--accent); font-weight: bold; margin: 10px 0;">4 000 ₽</p>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Плотное, с капюшоном.</p>
        <button class="btn" style="width: 100%;" onclick="buyItem('Худи ГАРТ')">Купить</button>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function buyItem(itemName) {
      const user = GART_AUTH.getCurrentUser();
      
      // Если гость — показываем модальное окно
      if (!user) {
        showAuthRequiredModal();
        return;
      }

      // Если авторизован — идем в сообщения к админу
      const admin = GART_DATA.users.find(u => u.role === 'admin');
      const adminNick = admin ? admin.nickname : 'Рагнар';

      const text = `Здравствуйте, я заинтересовался покупкой: ${itemName}`;
      window.location.href = `messages.html?with=${adminNick}&text=${encodeURIComponent(text)}`;
    }
  </script>
</body>
</html>
