<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Афиша — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px;">
    <h2>Афиша мероприятий</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Здесь вы можете узнать, куда и когда мы идем.</p>

    <div id="admin-create-block" class="card" style="display:none; border-color: var(--accent); margin-bottom: 40px;">
      <h3>Добавить событие</h3>
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <input type="text" id="ev-title" class="form-control" placeholder="Название">
        <input type="date" id="ev-date" class="form-control">
        <input type="text" id="ev-place" class="form-control" placeholder="Место">
        <select id="ev-status" class="form-control">
          <option value="upcoming">Предстоящее</option>
          <option value="past">Прошедшее</option>
        </select>
      </div>
      <button class="btn" style="margin-top: 15px;" onclick="addEvent()">Создать</button>
    </div>

    <h3 style="margin-bottom: 20px; color: var(--accent);">Предстоящие события</h3>
    <div class="grid" id="upcoming-events"></div>

    <h3 style="margin-bottom: 20px; margin-top: 50px;">Прошедшие события</h3>
    <div class="grid" id="past-events"></div>
  </main>

  <!-- Модалка отметки явки -->
  <div class="modal-overlay" id="attendance-modal">
    <div class="modal-content" style="max-width: 600px; text-align: left; padding: 0; overflow: hidden;">
      <div style="padding: 22px 24px 14px 24px; border-bottom: 1px solid var(--border-color); position: relative;">
        <button class="modal-close" onclick="closeAttendanceModal()" style="top: 14px; right: 14px;">&times;</button>
        <h3 class="modal-title" style="text-align: left; margin-bottom: 4px; padding-right: 30px;">Отметить явку</h3>
        <p id="attendance-event-title" style="color: var(--accent); font-size: 14px; margin: 0;"></p>
      </div>

      <!-- Блок поиска -->
      <div style="padding: 16px 24px; background: #0a0a0a; border-bottom: 1px solid var(--border-color);">
        <div style="position: relative; margin-bottom: 10px;">
          <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; pointer-events: none;">🔍</span>
          <input
            type="text"
            id="attendance-search"
            class="form-control"
            placeholder="Поиск по нику, имени или фамилии..."
            autocomplete="off"
            oninput="renderAttendanceList()"
            onkeydown="if (event.key === 'Enter') { event.preventDefault(); pickFirstVisible(); }"
            style="padding-left: 42px; font-size: 15px;"
          >
          <button
            type="button"
            onclick="clearSearch()"
            title="Очистить"
            style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px 8px; display: none;"
            id="attendance-search-clear">✕</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
          <span id="attendance-counter" style="font-size: 12px; color: var(--text-muted);">
            Найдено: 0 из 0 · Выбрано: 0
          </span>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="selectAllAttendance()">Выбрать видимых</button>
            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="clearAttendance()">Снять</button>
          </div>
        </div>
      </div>

      <!-- Список -->
      <div id="attendance-users-list" style="max-height: 380px; overflow-y: auto;"></div>

      <!-- Футер -->
      <div style="padding: 16px 24px; border-top: 1px solid var(--border-color); background: #0a0a0a;">
        <button class="btn" style="width: 100%;" onclick="saveAttendance()">Сохранить явку</button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    let currentEventId = null;
    let attendanceUsersCache = [];

    function getEvents() {
      const stored = JSON.parse(localStorage.getItem('gart_events') || 'null');
      if (stored) return stored;
      localStorage.setItem('gart_events', JSON.stringify(GART_DATA.events));
      return GART_DATA.events;
    }
    function saveEvents(events) { localStorage.setItem('gart_events', JSON.stringify(events)); }

    function renderEvents() {
      const events = getEvents();
      const user = GART_AUTH.getCurrentUser();
      const isAdmin = user && user.role === 'admin';
      document.getElementById('admin-create-block').style.display = isAdmin ? 'block' : 'none';

      const attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      const upcoming = events.filter(e => e.status === 'upcoming');
      const past = events.filter(e => e.status === 'past');

      const createCard = (e) => {
        const attendedCount = Array.isArray(attendance[e.id]) ? attendance[e.id].length : 0;
        const adminControls = isAdmin ? `
          <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
            <button class="btn btn-outline" style="flex:1; padding:10px;" onclick="openAttendanceModal(${e.id})">
              Явка${attendedCount ? ` · ${attendedCount}` : ''}
            </button>
            <button class="btn" style="background:#F44336; color:#fff; flex:1; padding:10px; box-shadow:none;" onclick="deleteEvent(${e.id})">Удалить</button>
          </div>` : '';

        return `
          <div class="card event-card" style="${e.status === 'past' ? 'opacity: 0.78;' : ''}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap:10px;">
              <h4 style="color: #fff; flex:1;">${escapeHtml(e.title)}</h4>
              <span class="status-badge ${e.status === 'past' ? 'past' : 'upcoming'}">
                ${e.status === 'past' ? 'Завершено' : 'Скоро'}
              </span>
            </div>
            <p style="color: var(--accent); font-weight: 700; margin-bottom: 12px; letter-spacing:0.5px;">${escapeHtml(e.date)}</p>
            <p style="color: var(--text-muted); margin-bottom: 4px;">📍 ${escapeHtml(e.place)}</p>
            <p style="color: var(--text-muted); margin-bottom: 20px;">🎯 ${escapeHtml(e.format || 'Офлайн')}</p>
            <a href="event.html?id=${e.id}" class="btn btn-outline" style="width: 100%; text-align: center; display: flex;">Подробнее</a>
            ${adminControls}
          </div>
        `;
      };

      document.getElementById('upcoming-events').innerHTML = upcoming.length
        ? upcoming.map(createCard).join('')
        : '<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">Пока пусто</div><p>Предстоящих событий нет</p></div>';
      document.getElementById('past-events').innerHTML = past.length
        ? past.map(createCard).join('')
        : '<div class="empty-state"><div class="empty-state-icon">🗓️</div><div class="empty-state-title">Архив пуст</div></div>';
    }

    function addEvent() {
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value;
      const place = document.getElementById('ev-place').value.trim();
      const status = document.getElementById('ev-status').value;
      if (!title || !date || !place) return showToast('Заполните все поля', 'error');

      const events = getEvents();
      events.push({ id: Date.now(), title, date, place, status, format: 'Офлайн' });
      saveEvents(events);
      document.getElementById('ev-title').value = '';
      document.getElementById('ev-date').value = '';
      document.getElementById('ev-place').value = '';
      renderEvents();
      showToast('Событие создано');
    }

    function deleteEvent(id) {
      if (!confirm('Удалить событие?')) return;
      saveEvents(getEvents().filter(e => e.id !== id));
      const attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      delete attendance[id];
      localStorage.setItem('gart_attendance', JSON.stringify(attendance));
      localStorage.removeItem(`gart_event_${id}`);
      renderEvents();
      showToast('Событие удалено', 'info');
    }

    function openAttendanceModal(eventId) {
      currentEventId = eventId;
      const event = getEvents().find(e => e.id === eventId);
      document.getElementById('attendance-event-title').innerText = event ? event.title : 'Событие';

      const searchInput = document.getElementById('attendance-search');
      searchInput.value = '';
      document.getElementById('attendance-search-clear').style.display = 'none';

      const allUsers = GART_DATA.users.filter(u => u.role !== 'admin');
      const approved = JSON.parse(localStorage.getItem('gart_applications') || '[]').filter(a => a.status === 'approved');
      const members = [...allUsers, ...approved].filter(u => u.nickname);

      // Убираем дубли по нику
      const uniqueMembers = Array.from(new Map(members.map(u => [u.nickname, u])).values());

      const attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      const attendedList = attendance[eventId] || [];

      attendanceUsersCache = uniqueMembers
        .map(u => ({
          nickname: u.nickname,
          firstName: u.firstName || u.name || '',
          lastName: u.lastName || '',
          attended: attendedList.includes(u.nickname)
        }))
        .sort((a, b) => a.nickname.localeCompare(b.nickname, 'ru'));

      renderAttendanceList();
      document.getElementById('attendance-modal').style.display = 'flex';
      setTimeout(() => searchInput.focus(), 80);
    }

    function filterUsers() {
      const query = (document.getElementById('attendance-search').value || '').toLowerCase().trim();
      if (!query) return attendanceUsersCache.slice();
      return attendanceUsersCache.filter(u =>
        u.nickname.toLowerCase().includes(query) ||
        u.firstName.toLowerCase().includes(query) ||
        u.lastName.toLowerCase().includes(query)
      );
    }

    function renderAttendanceList() {
      const list = document.getElementById('attendance-users-list');
      const clearBtn = document.getElementById('attendance-search-clear');
      const query = document.getElementById('attendance-search').value.trim();
      clearBtn.style.display = query ? 'block' : 'none';

      const filtered = filterUsers();

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state" style="padding: 40px 20px;">
          <div class="empty-state-icon">🔍</div>
          <div class="empty-state-title">Никого не нашли</div>
          <p style="font-size: 13px;">Попробуйте другой запрос</p>
        </div>`;
      } else {
        list.innerHTML = filtered.map(u => {
          const initials = (u.nickname || u.firstName || '?').charAt(0).toUpperCase();
          const realName = `${u.firstName} ${u.lastName}`.trim();
          return `
            <label class="attendance-row">
              <input type="checkbox" data-nick="${escapeHtml(u.nickname)}" ${u.attended ? 'checked' : ''} onchange="onAttendanceToggle(this)" class="attendance-checkbox">
              <div class="attendance-avatar">${escapeHtml(initials)}</div>
              <div style="min-width: 0; flex: 1;">
                <div style="color: #fff; font-weight: 600; font-size: 14px;">${escapeHtml(u.nickname)}</div>
                ${realName ? `<div style="color: var(--text-muted); font-size: 12px;">${escapeHtml(realName)}</div>` : ''}
              </div>
            </label>
          `;
        }).join('');
      }

      updateAttendanceCounter(filtered.length);
    }

    function onAttendanceToggle(cb) {
      const u = attendanceUsersCache.find(x => x.nickname === cb.dataset.nick);
      if (u) u.attended = cb.checked;
      updateAttendanceCounter(filterUsers().length);
    }

    function updateAttendanceCounter(visibleCount) {
      const total = attendanceUsersCache.filter(u => u.attended).length;
      document.getElementById('attendance-counter').innerText =
        `Найдено: ${visibleCount} из ${attendanceUsersCache.length} · Выбрано: ${total}`;
    }

    function clearSearch() {
      const input = document.getElementById('attendance-search');
      input.value = '';
      renderAttendanceList();
      input.focus();
    }

    function pickFirstVisible() {
      const filtered = filterUsers();
      if (!filtered.length) return;
      const first = filtered[0];
      first.attended = !first.attended;
      renderAttendanceList();
      // Прокрутить к нему
      const cb = document.querySelector(`#attendance-users-list input[data-nick="${CSS.escape(first.nickname)}"]`);
      if (cb) cb.scrollIntoView({ block: 'nearest' });
    }

    function selectAllAttendance() {
      filterUsers().forEach(u => { u.attended = true; });
      renderAttendanceList();
    }

    function clearAttendance() {
      filterUsers().forEach(u => { u.attended = false; });
      renderAttendanceList();
    }

    function closeAttendanceModal() {
      document.getElementById('attendance-modal').style.display = 'none';
    }

    function saveAttendance() {
      const attendedList = attendanceUsersCache.filter(u => u.attended).map(u => u.nickname);
      const attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      attendance[currentEventId] = attendedList;
      localStorage.setItem('gart_attendance', JSON.stringify(attendance));
      closeAttendanceModal();
      renderEvents();
      showToast(`Явка сохранена: ${attendedList.length} из ${attendanceUsersCache.length}`);
    }

    // Esc — закрыть модалку
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('attendance-modal').style.display === 'flex') {
        closeAttendanceModal();
      }
    });

    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
