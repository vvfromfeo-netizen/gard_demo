<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px; max-width: 600px;">
    <h2>Личный кабинет</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Управление вашим профилем.</p>

    <div class="card">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-family: var(--font-heading);">
          <span id="user-initial">В</span>
        </div>
        <div>
          <h3 id="user-name" style="margin-bottom: 5px;">Загрузка...</h3>
          <p id="user-role" style="color: var(--accent); font-size: 14px; text-transform: uppercase;">Участник</p>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="user-email" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Регион</label>
        <input type="text" class="form-control" value="Челябинск" readonly>
      </div>
      
      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 15px;">Ваша активность</h4>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Статистика по мероприятиям и тестам доступна администратору. Здесь вы можете скачать свои данные.</p>
        <button class="btn btn-outline" onclick="alert('Данные отправлены на почту (Демо)')">Запросить выгрузку данных</button>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = GART_AUTH.getCurrentUser();
      if (user) {
        document.getElementById('user-name').innerText = user.name;
        document.getElementById('user-email').value = user.email;
        document.getElementById('user-initial').innerText = user.name.charAt(0).toUpperCase();
        if (user.role === 'admin') {
           document.getElementById('user-role').innerText = 'Администратор';
           document.getElementById('user-role').style.color = '#4CAF50';
        }
      }
    });
  </script>
</body>
</html>
