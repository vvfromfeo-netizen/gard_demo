<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px; max-width: 600px;">
    <h2>Личный кабинет</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Управление вашим профилем.</p>

    <div class="card">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-family: var(--font-heading);">
          <span id="user-initial">В</span>
        </div>
        <div>
          <h3 id="user-name" style="margin-bottom: 5px;">Загрузка...</h3>
          <p id="user-role" style="color: var(--accent); font-size: 14px; text-transform: uppercase;">Участник</p>
        </div>
      </div>

      <div class="form-group">
        <label>Ваш никнейм (видят другие)</label>
        <input type="text" id="user-nickname" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Ваше имя (видно только вам и админу)</label>
        <input type="text" id="user-realname" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="user-email" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Регион</label>
        <input type="text" class="form-control" value="Челябинск" readonly>
      </div>
      
      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 15px; color: var(--accent);">Моя физическая активность</h4>
        <ul id="my-activity-list" style="list-style: none; padding: 0; margin-bottom: 30px;">
           <!-- Заполняется JS -->
        </ul>

        <h4 style="margin-bottom: 15px; color: var(--accent);">Посещенные мероприятия</h4>
        <ul style="list-style: none; padding: 0;">
           <li style="padding: 10px 0; border-bottom: 1px solid #222;">Поход в горы (15.10.2026) <span style="color: #4CAF50; float: right;">✓ Был</span></li>
           <li style="padding: 10px 0; border-bottom: 1px solid #222;">Чайная церемония (20.09.2026) <span style="color: #4CAF50; float: right;">✓ Был</span></li>
        </ul>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = GART_AUTH.getCurrentUser();
      if (user) {
        const safeNickname = user.nickname || user.name || 'User';
        
        document.getElementById('user-name').innerText = safeNickname;
        document.getElementById('user-nickname').value = safeNickname;
        document.getElementById('user-realname').value = user.name || safeNickname;
        document.getElementById('user-email').value = user.email;
        document.getElementById('user-initial').innerText = safeNickname.charAt(0).toUpperCase();
        
        if (user.role === 'admin') {
           document.getElementById('user-role').innerText = 'Администратор';
           document.getElementById('user-role').style.color = '#4CAF50';
        }

        const allActivity = JSON.parse(localStorage.getItem('gart_rating_new') || '[]');
        const myActivity = allActivity.filter(a => a.name === safeNickname).sort((a,b) => new Date(b.date) - new Date(a.date));
        
        const list = document.getElementById('my-activity-list');
        if (myActivity.length === 0) {
          list.innerHTML = '<li style="color: var(--text-muted); font-size: 14px;">Вы еще не вносили результаты.</li>';
        } else {
          list.innerHTML = myActivity.map(a => `
            <li style="padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
              <span>${a.exercise}</span>
              <strong style="color: var(--accent);">${a.value} <span style="font-size: 12px; color: #777; font-weight: normal;">(${a.date})</span></strong>
            </li>
          `).join('');
        }
      }
    });
  </script>
</body>
</html>
