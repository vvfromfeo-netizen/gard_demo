<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px; max-width: 600px;">
    <h2>Личный кабинет</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Управление вашим профилем.</p>

    <div class="card">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #FF7700, #FF9933); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-family: var(--font-heading);">
          <span id="user-initial">В</span>
        </div>
        <div>
          <h3 id="user-name" style="margin-bottom: 5px;">Загрузка...</h3>
          <p id="user-role" style="color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Участник</p>
        </div>
      </div>

      <div class="form-group">
        <label>Ваш никнейм (видят другие)</label>
        <input type="text" id="user-nickname" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Ваше имя (видно только вам и админу)</label>
        <input type="text" id="user-realname" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="user-email" class="form-control" readonly>
      </div>

      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 15px; color: var(--accent);">Моя физическая активность</h4>
        <ul id="my-activity-list" style="list-style: none; padding: 0; margin-bottom: 30px;"></ul>

        <h4 style="margin-bottom: 15px; color: var(--accent); display:flex; justify-content:space-between; align-items:center;">
          <span>Посещенные мероприятия</span>
          <span id="events-count" style="color: var(--text-main); font-weight: normal; font-size: 14px;">0</span>
        </h4>
        <ul id="my-events-list" style="list-style: none; padding: 0;"></ul>
        <p style="color: var(--text-muted); font-size: 12px; margin-top: 10px;">Этот рейтинг виден только вам и администратору.</p>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = GART_AUTH.getCurrentUser();
      if (!user) return;

      const safeNickname = user.nickname || user.firstName || 'User';

      document.getElementById('user-name').innerText = safeNickname;
      document.getElementById('user-nickname').value = safeNickname;
      document.getElementById('user-realname').value = user.firstName ? `${user.firstName} ${user.lastName}` : user.name;
      document.getElementById('user-email').value = user.email;
      document.getElementById('user-initial').innerText = safeNickname.charAt(0).toUpperCase();

      const roleEl = document.getElementById('user-role');
      if (user.role === 'admin') {
        roleEl.innerText = 'Администратор';
      } else if (user.role === 'candidate') {
        roleEl.innerText = 'Кандидат';
        roleEl.style.color = 'var(--text-muted)';
      } else {
        roleEl.innerText = 'Участник';
      }

      const allActivity = JSON.parse(localStorage.getItem('gart_rating_new') || '[]');
      const myActivity = allActivity.filter(a => a.name === safeNickname).sort((a,b) => new Date(b.date) - new Date(a.date));

      const actList = document.getElementById('my-activity-list');
      if (myActivity.length === 0) {
        actList.innerHTML = '<li style="color: var(--text-muted); font-size: 14px;">Вы еще не вносили результаты.</li>';
      } else {
        actList.innerHTML = myActivity.map(a => `
          <li style="padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
            <span>${escapeHtml(a.exercise)}</span>
            <strong style="color: var(--accent);">${escapeHtml(a.value)} <span style="font-size: 12px; color: #777; font-weight: normal;">(${escapeHtml(a.date)})</span></strong>
          </li>
        `).join('');
      }

      const events = JSON.parse(localStorage.getItem('gart_events') || 'null') || GART_DATA.events;
      const attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      const eventList = document.getElementById('my-events-list');
      let visitedEvents = [];

      for (const eventId in attendance) {
        if (Array.isArray(attendance[eventId]) && attendance[eventId].includes(safeNickname)) {
          const event = events.find(e => e.id == eventId);
          if (event) visitedEvents.push(event);
        }
      }

      document.getElementById('events-count').innerText = visitedEvents.length;

      if (visitedEvents.length === 0) {
        eventList.innerHTML = '<li style="color: var(--text-muted); font-size: 14px;">Пока нет посещенных мероприятий.</li>';
      } else {
        eventList.innerHTML = visitedEvents.map(e => `
          <li style="padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
            <span>${escapeHtml(e.title)} (${escapeHtml(e.date)})</span>
            <span style="color: #4CAF50; font-weight: bold;">✓ Был</span>
          </li>
        `).join('');
      }
    });
  </script>
</body>
</html>
