<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление мероприятиями — Админка ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="admin">
  <main class="container" style="margin-top: 40px;">
    <h2 style="margin-bottom: 20px;">Управление мероприятиями</h2>
    
    <!-- Форма создания -->
    <div class="card" style="border-color: var(--accent); margin-bottom: 40px;">
      <h3>Добавить событие</h3>
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <input type="text" id="ev-title" class="form-control" placeholder="Название">
        <input type="date" id="ev-date" class="form-control">
        <input type="text" id="ev-place" class="form-control" placeholder="Место">
        <select id="ev-status" class="form-control">
          <option value="upcoming">Предстоящее</option>
          <option value="past">Прошедшее</option>
        </select>
      </div>
      <button class="btn" style="margin-top: 15px;" onclick="addEvent()">Создать</button>
    </div>

    <!-- Список событий -->
    <div id="events-list"></div>

    <!-- Модальное окно для отметки явки -->
    <div class="modal-overlay" id="attendance-modal">
      <div class="modal-content" style="max-width: 500px;">
        <button class="modal-close" onclick="closeAttendanceModal()">&times;</button>
        <h3 class="modal-title">Отметить явку</h3>
        <p id="attendance-event-title" style="color: var(--accent); margin-bottom: 15px;"></p>
        <div id="attendance-users-list" style="max-height: 300px; overflow-y: auto; text-align: left; margin-bottom: 20px;">
          <!-- Сюда рендерятся пользователи с чекбоксами -->
        </div>
        <button class="btn" style="width: 100%;" onclick="saveAttendance()">Сохранить</button>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    let currentEventId = null;

    function renderEvents() {
      const events = GART_DATA.events;
      const container = document.getElementById('events-list');
      
      container.innerHTML = events.map(e => `
        <div class="card" style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <h3 style="margin-bottom: 5px;">${e.title}</h3>
            <p style="color: var(--text-muted); font-size: 14px;">${e.date} | ${e.place}</p>
            <span style="font-size: 12px; padding: 2px 8px; border-radius: 10px; background: ${e.status === 'past' ? '#444' : 'var(--accent)'}; color: ${e.status === 'past' ? '#aaa' : '#000'};">
              ${e.status === 'past' ? 'Прошло' : 'Скоро'}
            </span>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="openAttendanceModal(${e.id}, '${e.title}')">Явка</button>
            <button class="btn" style="background: #F44336; color: #fff;" onclick="deleteEvent(${e.id})">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    function addEvent() {
      const title = document.getElementById('ev-title').value;
      const date = document.getElementById('ev-date').value;
      const place = document.getElementById('ev-place').value;
      const status = document.getElementById('ev-status').value;
      
      if (!title || !date || !place) return alert('Заполните поля');

      // Добавляем в глобальный массив (в прототипе он не сохраняется в LS, но для админки работает)
      GART_DATA.events.push({
        id: Date.now(),
        title, date, place, status,
        format: 'Офлайн'
      });
      
      document.getElementById('ev-title').value = '';
      document.getElementById('ev-date').value = '';
      document.getElementById('ev-place').value = '';
      renderEvents();
    }

    function deleteEvent(id) {
      if (!confirm('Удалить событие?')) return;
      // Удаляем из глобального массива
      const index = GART_DATA.events.findIndex(e => e.id === id);
      if (index !== -1) GART_DATA.events.splice(index, 1);
      renderEvents();
    }

    // --- ОТМЕТКА ЯВКИ ---
    function openAttendanceModal(eventId, eventTitle) {
      currentEventId = eventId;
      document.getElementById('attendance-event-title').innerText = eventTitle;
      
      const allUsers = GART_DATA.users.filter(u => u.role !== 'admin');
      const approved = JSON.parse(localStorage.getItem('gart_applications') || '[]').filter(a => a.status === 'approved');
      const members = [...allUsers, ...approved];

      // Загружаем текущую явку
      let attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      const attendedList = attendance[eventId] || [];

      const list = document.getElementById('attendance-users-list');
      list.innerHTML = members.map(u => `
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer;">
          <input type="checkbox" value="${u.nickname}" ${attendedList.includes(u.nickname) ? 'checked' : ''} style="width: 18px; height: 18px;">
          <span style="color: #fff;">${u.nickname}</span>
          <span style="color: var(--text-muted); font-size: 12px;">(${u.firstName || u.name || 'Участник'})</span>
        </label>
      `).join('');

      document.getElementById('attendance-modal').style.display = 'flex';
    }

    function closeAttendanceModal() {
      document.getElementById('attendance-modal').style.display = 'none';
    }

    function saveAttendance() {
      const checkboxes = document.querySelectorAll('#attendance-users-list input[type="checkbox"]:checked');
      const attendedList = Array.from(checkboxes).map(cb => cb.value);

      let attendance = JSON.parse(localStorage.getItem('gart_attendance') || '{}');
      attendance[currentEventId] = attendedList;
      localStorage.setItem('gart_attendance', JSON.stringify(attendance));

      closeAttendanceModal();
      alert('Явка сохранена!');
    }

    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
