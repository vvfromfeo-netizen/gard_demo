<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг активности — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px;">
    <h2>Рейтинг активности</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Мягкая мотивация. Вносите свои результаты и смотрите на других.</p>

    <div class="grid">
      <!-- Форма ввода -->
      <div class="card" style="height: fit-content;">
        <h3>Внести результат</h3>
        <div class="form-group">
          <label>Вид упражнения</label>
          <select id="act-type" class="form-control">
            <option value="Отжимания">Отжимания</option>
            <option value="Подтягивания">Подтягивания</option>
            <option value="Приседания">Приседания</option>
            <option value="Бег (км)">Бег (км)</option>
            <option value="Шаги">Шаги</option>
          </select>
        </div>
        <div class="form-group">
          <label>Результат (кол-во)</label>
          <input type="number" id="act-value" class="form-control" placeholder="Например: 50">
        </div>
        <button class="btn" style="width: 100%;" onclick="submitActivity()">Добавить</button>
      </div>

      <!-- Таблица рейтинга -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h3>Таблица</h3>
          <div style="display: flex; gap: 10px;">
            <select id="filter-type" class="form-control" style="width: auto; padding: 5px 10px;" onchange="renderRating()">
              <option value="all">Все упражнения</option>
              <option value="Отжимания">Отжимания</option>
              <option value="Подтягивания">Подтягивания</option>
              <option value="Приседания">Приседания</option>
              <option value="Бег (км)">Бег (км)</option>
              <option value="Шаги">Шаги</option>
            </select>
            <select id="sort-type" class="form-control" style="width: auto; padding: 5px 10px;" onchange="renderRating()">
              <option value="date">Сначала новые</option>
              <option value="value">По количеству</option>
            </select>
          </div>
        </div>
        
        <table style="width: 100%; text-align: left; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px;">
              <th style="padding: 10px 0;">Участник</th>
              <th style="padding: 10px 0;">Упражнение</th>
              <th style="padding: 10px 0;">Результат</th>
              <th style="padding: 10px 0;">Дата</th>
            </tr>
          </thead>
          <tbody id="rating-body">
            <!-- Заполняется через JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    if (!localStorage.getItem('gart_rating_new')) {
      const initialData = [
        { id: 1, name: 'Алексей', exercise: 'Отжимания', value: 50, date: '2026-11-04' },
        { id: 2, name: 'Владимир', exercise: 'Бег (км)', value: 10, date: '2026-11-03' },
        { id: 3, name: 'Иван', exercise: 'Отжимания', value: 70, date: '2026-11-01' }
      ];
      localStorage.setItem('gart_rating_new', JSON.stringify(initialData));
    }

    function renderRating() {
      let data = JSON.parse(localStorage.getItem('gart_rating_new'));
      const filterType = document.getElementById('filter-type').value;
      const sortType = document.getElementById('sort-type').value;

      if (filterType !== 'all') {
        data = data.filter(d => d.exercise === filterType);
      }

      if (sortType === 'date') {
        data.sort((a, b) => new Date(b.date) - new Date(a.date));
      } else {
        data.sort((a, b) => b.value - a.value);
      }

      const tbody = document.getElementById('rating-body');
      if(data.length === 0) {
         tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px 0; color: var(--text-muted);">Нет данных по этому фильтру.</td></tr>';
         return;
      }

      tbody.innerHTML = data.map(u => `
        <tr style="border-bottom: 1px solid #222;">
          <td style="padding: 12px 0; font-weight: bold; color: #fff;">${u.name}</td>
          <td style="padding: 12px 0; color: var(--text-muted);">${u.exercise}</td>
          <td style="padding: 12px 0; color: var(--accent); font-weight: bold;">${u.value}</td>
          <td style="padding: 12px 0; font-size: 12px; color: #777;">${u.date}</td>
        </tr>
      `).join('');
    }

    function submitActivity() {
      const exercise = document.getElementById('act-type').value;
      const value = parseInt(document.getElementById('act-value').value);
      
      if (!value || value <= 0) return alert('Введите корректный результат');

      const user = GART_AUTH.getCurrentUser();
      let data = JSON.parse(localStorage.getItem('gart_rating_new'));
      
      data.push({
        id: Date.now(),
        name: user.name,
        exercise: exercise,
        value: value,
        date: new Date().toISOString().split('T')[0]
      });

      localStorage.setItem('gart_rating_new', JSON.stringify(data));
      document.getElementById('act-value').value = '';
      renderRating();
      alert('Результат добавлен!');
    }

    document.addEventListener('DOMContentLoaded', renderRating);
  </script>
</body>
</html>
