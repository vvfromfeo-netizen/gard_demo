<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг активности — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px;">
    <h2>Рейтинг активности</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Мягкая мотивация. Вносите свои результаты и смотрите на других.</p>

    <div class="grid">
      <!-- Форма ввода -->
      <div class="card" style="height: fit-content;">
        <h3>Внести результат</h3>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Сегодня я сделал:</p>
        <div class="form-group">
          <label>Отжимания (кол-во)</label>
          <input type="number" id="act-pushups" class="form-control" placeholder="Например: 50">
        </div>
        <div class="form-group">
          <label>Шаги (кол-во)</label>
          <input type="number" id="act-steps" class="form-control" placeholder="Например: 10000">
        </div>
        <button class="btn" style="width: 100%;" onclick="submitActivity()">Добавить в рейтинг</button>
      </div>

      <!-- Таблица рейтинга -->
      <div class="card">
        <h3>Таблица лидеров</h3>
        <table style="width: 100%; margin-top: 20px; text-align: left; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
              <th style="padding: 10px 0;">Участник</th>
              <th style="padding: 10px 0;">Отжимания</th>
              <th style="padding: 10px 0;">Шаги</th>
            </tr>
          </thead>
          <tbody id="rating-body">
            <!-- Заполняется через JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    // Инициализация фейковых данных для рейтинга
    if (!localStorage.getItem('gart_rating')) {
      localStorage.setItem('gart_rating', JSON.stringify([
        { name: 'Алексей', pushups: 150, steps: 45000 },
        { name: 'Владимир', pushups: 200, steps: 30000 },
        { name: 'Иван', pushups: 50, steps: 12000 }
      ]));
    }

    function renderRating() {
      const data = JSON.parse(localStorage.getItem('gart_rating'));
      // Сортировка по отжиманиям (или можно по общей сумме)
      data.sort((a, b) => b.pushups - a.pushups);

      const tbody = document.getElementById('rating-body');
      tbody.innerHTML = data.map(u => `
        <tr style="border-bottom: 1px solid #222;">
          <td style="padding: 12px 0; font-weight: bold; color: #fff;">${u.name}</td>
          <td style="padding: 12px 0;">${u.pushups}</td>
          <td style="padding: 12px 0;">${u.steps}</td>
        </tr>
      `).join('');
    }

    function submitActivity() {
      const pushups = parseInt(document.getElementById('act-pushups').value) || 0;
      const steps = parseInt(document.getElementById('act-steps').value) || 0;
      
      if (pushups === 0 && steps === 0) return alert('Введите хотя бы один результат');

      const user = GART_AUTH.getCurrentUser();
      let data = JSON.parse(localStorage.getItem('gart_rating'));
      
      const userIndex = data.findIndex(u => u.name === user.name);
      if (userIndex !== -1) {
        data[userIndex].pushups += pushups;
        data[userIndex].steps += steps;
      } else {
        data.push({ name: user.name, pushups, steps });
      }

      localStorage.setItem('gart_rating', JSON.stringify(data));
      document.getElementById('act-pushups').value = '';
      document.getElementById('act-steps').value = '';
      renderRating();
      alert('Результат добавлен!');
    }

    document.addEventListener('DOMContentLoaded', renderRating);
  </script>
</body>
</html>
