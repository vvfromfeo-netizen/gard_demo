<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Модерация — Админка ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="admin">
  <main class="container" style="margin-top: 40px; max-width: 800px;">
    <h2>Модерация публикаций</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Управление контентом на внутренней площадке.</p>

    <div id="moderation-list"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function renderModeration() {
      const posts = JSON.parse(localStorage.getItem('gart_posts') || '[]');
      const container = document.getElementById('moderation-list');
      
      if (posts.length === 0) {
        container.innerHTML = '<p>Нет публикаций для модерации.</p>';
        return;
      }

      container.innerHTML = posts.map(post => `
        <div class="card" style="border-left: 4px solid ${post.hidden ? '#F44336' : 'var(--border-color)'};">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <strong style="color: #fff;">${post.author}</strong>
            <span style="font-size: 12px; color: var(--text-muted);">${post.date}</span>
          </div>
          <p style="margin-bottom: 20px; opacity: ${post.hidden ? '0.5' : '1'};">${post.text}</p>
          
          <div style="display: flex; gap: 10px;">
            ${!post.hidden 
              ? `<button class="btn btn-outline" style="padding: 8px 16px; font-size: 12px;" onclick="toggleHide(${post.id})">Скрыть</button>`
              : `<button class="btn" style="padding: 8px 16px; font-size: 12px; background: #4CAF50; color: #fff;" onclick="toggleHide(${post.id})">Восстановить</button>`
            }
            <button class="btn btn-outline" style="padding: 8px 16px; font-size: 12px; border-color: #F44336; color: #F44336;" onclick="deletePost(${post.id})">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    function toggleHide(id) {
      let posts = JSON.parse(localStorage.getItem('gart_posts'));
      const index = posts.findIndex(p => p.id === id);
      if (index !== -1) {
        posts[index].hidden = !posts[index].hidden;
        localStorage.setItem('gart_posts', JSON.stringify(posts));
        renderModeration();
      }
    }

    function deletePost(id) {
      if (!confirm('Удалить публикацию навсегда?')) return;
      let posts = JSON.parse(localStorage.getItem('gart_posts'));
      posts = posts.filter(p => p.id !== id);
      localStorage.setItem('gart_posts', JSON.stringify(posts));
      renderModeration();
    }

    document.addEventListener('DOMContentLoaded', renderModeration);
  </script>
</body>
</html>
