<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 40px; max-width: 800px;">
    <h2>Новости клуба</h2>
    
    <div id="news-container" style="margin-top: 30px;"></div>

    <!-- Форма добавления (только для админа) -->
    <div class="card" id="add-news-form" style="display: none; border-color: var(--accent); margin-top: 40px;">
      <h3>Добавить новость</h3>
      <div class="form-group"><input type="text" id="news-title" class="form-control" placeholder="Заголовок"></div>
      <div class="form-group"><textarea id="news-text" class="form-control" rows="3" placeholder="Текст новости"></textarea></div>
      <button class="btn" onclick="createNews()">Опубликовать</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function renderNews() {
      const newsList = JSON.parse(localStorage.getItem('gart_news') || '[]');
      const user = GART_AUTH.getCurrentUser();
      const isAdmin = user && user.role === 'admin';
      const container = document.getElementById('news-container');

      if (isAdmin) {
        document.getElementById('add-news-form').style.display = 'block';
      }

      container.innerHTML = [...newsList].reverse().map(item => {
        const comments = item.comments || [];
        const commentsHTML = comments.map(c => `
          <div style="margin-top: 10px; padding: 10px; background: #1a1a1a; border-left: 2px solid var(--border-color); font-size: 14px;">
            <strong>${c.author}:</strong> ${c.text}
            ${isAdmin ? `<button onclick="deleteNewsComment(${item.id}, '${c.text}')" style="color:#F44336; background:none; border:none; cursor:pointer; float:right;">Удалить</button>` : ''}
          </div>
        `).join('');

        return `
          <div class="card" style="margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between;">
              <span style="color: var(--accent); font-size: 14px;">${item.date}</span>
              ${isAdmin ? `<button onclick="deleteNews(${item.id})" style="color:#F44336; background:none; border:none; cursor:pointer;">Удалить новость</button>` : ''}
            </div>
            <h3 style="margin: 10px 0;">${item.title}</h3>
            <p style="color: var(--text-muted);">${item.text}</p>
            
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #222;">
              <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Комментарии (${comments.length}):</p>
              ${commentsHTML}
              <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="news-comment-${item.id}" class="form-control" placeholder="Ваш комментарий..." style="padding: 8px;">
                <button class="btn" style="padding: 8px 15px;" onclick="addNewsComment(${item.id})">Ответить</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function createNews() {
      const title = document.getElementById('news-title').value;
      const text = document.getElementById('news-text').value;
      if (!title || !text) return alert('Заполните поля');
      
      let news = JSON.parse(localStorage.getItem('gart_news'));
      news.push({ id: Date.now(), title, text, date: new Date().toLocaleDateString('ru-RU'), comments: [] });
      localStorage.setItem('gart_news', JSON.stringify(news));
      document.getElementById('news-title').value = '';
      document.getElementById('news-text').value = '';
      renderNews();
    }

    function deleteNews(id) {
      if (!confirm('Удалить новость?')) return;
      let news = JSON.parse(localStorage.getItem('gart_news'));
      news = news.filter(n => n.id !== id);
      localStorage.setItem('gart_news', JSON.stringify(news));
      renderNews();
    }

    function addNewsComment(newsId) {
      const input = document.getElementById(`news-comment-${newsId}`);
      const text = input.value.trim();
      if (!text) return;
      const user = GART_AUTH.getCurrentUser();
      let news = JSON.parse(localStorage.getItem('gart_news'));
      const item = news.find(n => n.id === newsId);
      if (item) {
        item.comments.push({ author: user.nickname, text });
        localStorage.setItem('gart_news', JSON.stringify(news));
        renderNews();
      }
    }

    function deleteNewsComment(newsId, commentText) {
      let news = JSON.parse(localStorage.getItem('gart_news'));
      const item = news.find(n => n.id === newsId);
      if (item) {
        item.comments = item.comments.filter(c => c.text !== commentText);
        localStorage.setItem('gart_news', JSON.stringify(news));
        renderNews();
      }
    }

    document.addEventListener('DOMContentLoaded', renderNews);
  </script>
</body>
</html>
