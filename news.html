<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 40px; max-width: 800px;">
    <h2>Новости клуба</h2>
    <div id="news-container" style="margin-top: 30px;"></div>

    <div class="card" id="add-news-form" style="display: none; border-color: var(--accent); margin-top: 40px;">
      <h3>Добавить новость</h3>
      <div style="border: 2px dashed #444; border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; cursor: pointer; transition: border-color 0.2s;" onmouseover="this.style.borderColor='#777'" onmouseout="this.style.borderColor='#444'">
        <div style="font-size: 32px; color: #666; margin-bottom: 10px;">📷</div>
        <div style="color: #666; font-size: 14px;">Прикрепить фотографию</div>
        <div style="color: #444; font-size: 12px; margin-top: 5px;">(Работает в боевой версии)</div>
      </div>
      <div class="form-group"><input type="text" id="news-title" class="form-control" placeholder="Заголовок"></div>
      <div class="form-group"><textarea id="news-text" class="form-control" rows="3" placeholder="Текст новости"></textarea></div>
      <button class="btn" onclick="createNews()">Опубликовать</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    // Миграция: чистим комментарии в уже сохранённых новостях
    (function cleanNewsComments() {
      const news = JSON.parse(localStorage.getItem('gart_news') || '[]');
      let changed = false;
      news.forEach(n => { if ('comments' in n) { delete n.comments; changed = true; } });
      if (changed) localStorage.setItem('gart_news', JSON.stringify(news));
    })();

    function renderNews() {
      const newsList = JSON.parse(localStorage.getItem('gart_news') || '[]');
      const user = GART_AUTH.getCurrentUser();
      const isAdmin = user && user.role === 'admin';
      const container = document.getElementById('news-container');

      if (isAdmin) document.getElementById('add-news-form').style.display = 'block';

      container.innerHTML = [...newsList].reverse().map(item => `
        <div class="card" style="margin-bottom: 20px;">
          <div style="display:flex; justify-content:space-between;">
            <span style="color: var(--accent); font-size: 14px;">${escapeHtml(item.date)}</span>
            ${isAdmin ? `<button onclick="deleteNews(${item.id})" style="color:#F44336; background:none; border:none; cursor:pointer; font-size:14px;">Удалить новость</button>` : ''}
          </div>
          <h3 style="margin: 10px 0;">${escapeHtml(item.title)}</h3>
          <p style="color: var(--text-muted);">${escapeHtml(item.text)}</p>
        </div>
      `).join('');
    }

    function createNews() {
      const title = document.getElementById('news-title').value.trim();
      const text = document.getElementById('news-text').value.trim();
      if (!title || !text) return alert('Заполните поля');

      let news = JSON.parse(localStorage.getItem('gart_news') || '[]');
      news.push({ id: Date.now(), title, text, date: new Date().toLocaleDateString('ru-RU') });
      localStorage.setItem('gart_news', JSON.stringify(news));
      document.getElementById('news-title').value = '';
      document.getElementById('news-text').value = '';
      renderNews();
    }

    function deleteNews(id) {
      if (!confirm('Удалить новость?')) return;
      let news = JSON.parse(localStorage.getItem('gart_news') || '[]');
      news = news.filter(n => n.id !== id);
      localStorage.setItem('gart_news', JSON.stringify(news));
      renderNews();
    }

    document.addEventListener('DOMContentLoaded', renderNews);
  </script>
</body>
</html>
