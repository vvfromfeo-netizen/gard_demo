<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px; max-width: 600px;">
    <a href="feed.html" style="color: var(--text-muted); font-size: 14px;">&larr; Назад в ленту</a>
    
    <div class="card" style="margin-top: 20px;">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-family: var(--font-heading);" id="profile-initial">
          ?
        </div>
        <div>
          <h2 id="profile-name" style="margin-bottom: 5px;">Загрузка...</h2>
          <p style="color: var(--accent); font-size: 14px; text-transform: uppercase;">Участник клуба</p>
        </div>
      </div>

      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 15px; color: var(--accent);">Физическая активность</h4>
        <ul id="profile-activity-list" style="list-style: none; padding: 0;">
           <!-- Заполняется JS -->
        </ul>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const nickname = urlParams.get('nickname');

      if (!nickname) {
        document.getElementById('profile-name').innerText = 'Участник не найден';
        return;
      }

      document.getElementById('profile-name').innerText = nickname;
      document.getElementById('profile-initial').innerText = nickname.charAt(0).toUpperCase();

      // Если зашел Админ, показываем реальное имя
      const currentUser = GART_AUTH.getCurrentUser();
      if (currentUser && currentUser.role === 'admin') {
        let realName = '';
        const mockUser = GART_DATA.users.find(u => u.nickname === nickname);
        if (mockUser) {
          realName = mockUser.name;
        } else {
          const app = JSON.parse(localStorage.getItem('gart_applications') || '[]').find(a => a.nickname === nickname);
          if (app) realName = app.name;
        }
        if (realName) {
          document.getElementById('profile-name').innerHTML = `${nickname} <span style="font-size:16px; color:var(--text-muted); font-weight:normal;">(${realName})</span>`;
        }
      }

      const allActivity = JSON.parse(localStorage.getItem('gart_rating_new') || '[]');
      const userActivity = allActivity.filter(a => a.name === nickname).sort((a,b) => new Date(b.date) - new Date(a.date));
      
      const list = document.getElementById('profile-activity-list');
      if (userActivity.length === 0) {
        list.innerHTML = '<li style="color: var(--text-muted); font-size: 14px;">Пользователь еще не вносил результаты.</li>';
      } else {
        list.innerHTML = userActivity.map(a => `
          <li style="padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
            <span>${a.exercise}</span>
            <strong style="color: var(--accent);">${a.value} <span style="font-size: 12px; color: #777; font-weight: normal;">(${a.date})</span></strong>
          </li>
        `).join('');
      }
    });
  </script>
</body>
</html>
