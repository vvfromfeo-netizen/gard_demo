<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 100px; max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 30px;">Вход в систему</h2>
    <div class="card">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="user@demo">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" class="form-control" value="123" readonly>
      </div>
      <button class="btn" style="width: 100%;" onclick="doLogin()">Войти</button>
      
      <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Нет аккаунта?</p>
        <a href="apply.html" class="btn btn-outline" style="width: 100%; display: block;">Подать заявку на вступление</a>
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--text-muted);">
        <p>Тестовые аккаунты: user@demo / admin@demo</p>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      if (GART_AUTH.login(email)) {
        const user = GART_AUTH.getCurrentUser();
        if (user.role === 'admin') window.location.href = 'admin-applications.html';
        else window.location.href = 'messages.html';
      } else {
        alert('Пользователь не найден. Используйте user@demo или admin@demo');
      }
    }
  </script>
</body>
</html>
