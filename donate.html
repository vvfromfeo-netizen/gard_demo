<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержать проект — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 60px; max-width: 500px;">
    <h2 style="text-align: center; margin-bottom: 10px;">Поддержать ГАРТ</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Ваши донаты помогают нам проводить офлайн-встречи и содержать площадку.</p>

    <div class="card">
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-outline" style="flex: 1;" onclick="setAmount(500)">500 ₽</button>
        <button class="btn btn-outline" style="flex: 1;" onclick="setAmount(1000)">1000 ₽</button>
        <button class="btn btn-outline" style="flex: 1;" onclick="setAmount(3000)">3000 ₽</button>
      </div>
      
      <div class="form-group">
        <label>Сумма (₽)</label>
        <input type="number" id="donate-amount" class="form-control" style="font-size: 24px; font-family: var(--font-heading);" placeholder="500">
      </div>
      <div class="form-group">
        <label>Ваше имя (или оставить анонимно)</label>
        <input type="text" id="donate-name" class="form-control" placeholder="Иван">
      </div>
      <div class="form-group">
        <label>Email для чека</label>
        <input type="email" id="donate-email" class="form-control" placeholder="mail@example.com">
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="submitDonation()">Перейти к оплате</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function setAmount(amount) {
      document.getElementById('donate-amount').value = amount;
    }

    function submitDonation() {
      const amount = document.getElementById('donate-amount').value;
      const email = document.getElementById('donate-email').value;
      
      if (!amount || amount <= 0) return alert('Введите сумму');
      if (!email) return alert('Введите email');

      // Имитация редиректа на платежный шлюз
      alert(`Перенаправление на защищенную страницу оплаты (Демо).\nСумма: ${amount} ₽.`);
    }
  </script>
</body>
</html>
