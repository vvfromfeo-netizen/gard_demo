<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подать заявку — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 60px; max-width: 600px;">
    <h2 style="margin-bottom: 10px;">Заявка на вступление</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Заполните данные. Координатор рассмотрит вашу заявку и свяжется с вами.</p>

    <div class="card" id="form-card">
      <div class="form-group">
        <label>ФИО *</label>
        <input type="text" id="app-name" class="form-control" placeholder="Иванов Иван Иванович" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="app-email" class="form-control" placeholder="mail@example.com" required>
      </div>
      <div class="form-group">
        <label>Телефон *</label>
        <input type="tel" id="app-phone" class="form-control" placeholder="+7 (999) 123-45-67" required>
      </div>
      <div class="form-group">
        <label>Регион *</label>
        <input type="text" id="app-region" class="form-control" placeholder="Челябинск" required>
      </div>
      <div class="form-group">
        <label>Откуда вы узнали о клубе? *</label>
        <select id="app-source" class="form-control" required>
          <option value="">-- Выберите --</option>
          <option value="Рекомендация друзей/близких">Рекомендация друзей/близких</option>
          <option value="Блог Владимира">Блог Владимира</option>
          <option value="Социальные сети">Социальные сети</option>
          <option value="Поиск в интернете">Поиск в интернете</option>
          <option value="Другое">Другое</option>
        </select>
      </div>

      <div class="form-group" style="display: flex; gap: 10px; align-items: flex-start; margin-top: 20px;">
        <input type="checkbox" id="app-consent" style="margin-top: 5px;">
        <label for="app-consent" style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">
          Я даю согласие на обработку персональных данных в соответствии с <a href="legal.html">Политикой конфиденциальности</a> и принимаю <a href="legal.html">Пользовательское соглашение</a>.
        </label>
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="submitApplication()">Отправить заявку</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function submitApplication() {
      const name = document.getElementById('app-name').value;
      const email = document.getElementById('app-email').value;
      const phone = document.getElementById('app-phone').value;
      const region = document.getElementById('app-region').value;
      const source = document.getElementById('app-source').value;
      const consent = document.getElementById('app-consent').checked;

      if (!name || !email || !phone || !region || !source) {
        return alert('Пожалуйста, заполните все обязательные поля.');
      }
      if (!consent) {
        return alert('Необходимо согласие на обработку персональных данных.');
      }

      // Сохраняем в localStorage
      const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      apps.push({
        id: Date.now(),
        name: name,
        email: email,
        phone: phone,
        region: region,
        source: source,
        status: 'pending',
        date: new Date().toLocaleDateString('ru-RU')
      });
      localStorage.setItem('gart_applications', JSON.stringify(apps));

      // Показываем успех
      document.getElementById('form-card').innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <h3 style="color: var(--accent); margin-bottom: 15px;">Заявка отправлена!</h3>
          <p>Ваша заявка находится на рассмотрении у координатора.</p>
          <p style="margin-top: 10px; font-size: 14px; color: var(--text-muted);">В демо-режиме: переключитесь на роль <strong>Админ</strong> в нижней панели, чтобы одобрить её.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
