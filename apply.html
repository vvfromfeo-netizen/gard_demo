<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подать заявку — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 60px; max-width: 600px;">
    <h2 style="margin-bottom: 10px;">Заявка на вступление</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Заполните данные. Координатор рассмотрит вашу заявку.</p>

    <div class="card" id="form-card">
      <div class="form-group">
        <label>Имя *</label>
        <input type="text" id="app-firstName" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Фамилия *</label>
        <input type="text" id="app-lastName" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Возраст (полных лет) *</label>
        <input type="number" id="app-age" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Никнейм (будет виден другим) *</label>
        <input type="text" id="app-nickname" class="form-control" placeholder="Например: Свенельд" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="app-email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Телефон *</label>
        <input type="tel" id="app-phone" class="form-control" required>
      </div>

      <div class="form-group" style="display: flex; gap: 10px; align-items: flex-start; margin-top: 20px;">
        <input type="checkbox" id="app-consent" style="margin-top: 5px;">
        <label for="app-consent" style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">
          Я даю согласие на обработку персональных данных.
        </label>
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="submitApplication()">Отправить заявку</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function submitApplication() {
      const firstName = document.getElementById('app-firstName').value;
      const lastName = document.getElementById('app-lastName').value;
      const age = document.getElementById('app-age').value;
      const nickname = document.getElementById('app-nickname').value;
      const email = document.getElementById('app-email').value;
      const phone = document.getElementById('app-phone').value;
      const consent = document.getElementById('app-consent').checked;

      if (!firstName || !lastName || !age || !nickname || !email || !phone) {
        return alert('Пожалуйста, заполните все поля.');
      }
      if (!consent) {
        return alert('Необходимо согласие на обработку данных.');
      }

      const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      apps.push({
        id: Date.now(),
        firstName, lastName, age, nickname, email, phone,
        status: 'pending',
        date: new Date().toLocaleDateString('ru-RU')
      });
      localStorage.setItem('gart_applications', JSON.stringify(apps));

      document.getElementById('form-card').innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <h3 style="color: var(--accent); margin-bottom: 15px;">Заявка отправлена!</h3>
          <p>Ожидайте решения координатора.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
