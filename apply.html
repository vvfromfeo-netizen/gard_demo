<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подать заявку — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container" style="margin-top: 60px; max-width: 600px;">
    <h2 style="margin-bottom: 10px;">Заявка на вступление</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Заполните данные. Координатор рассмотрит вашу заявку.</p>

    <div class="card" id="form-card">
      <div class="form-group">
        <label>Имя *</label>
        <input type="text" id="app-firstName" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Фамилия *</label>
        <input type="text" id="app-lastName" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Возраст (полных лет) *</label>
        <input type="number" id="app-age" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Город *</label>
        <input type="text" id="app-city" class="form-control" placeholder="Челябинск" required>
      </div>
      <div class="form-group">
        <label>Никнейм (будет виден другим) *</label>
        <input type="text" id="app-nickname" class="form-control" placeholder="Например: Свенельд" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="app-email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Телефон *</label>
        <input type="tel" id="app-phone" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label>Откуда вы узнали о клубе? *</label>
        <select id="app-source" class="form-control" required onchange="toggleOtherSource()">
          <option value="">-- Выберите --</option>
          <option value="Блог или соцсети Владимира">1. Блог или соцсети Владимира</option>
          <option value="Занимался у Владимира">2. Занимался у Владимира (массаж, ЛФК, психолог)</option>
          <option value="Сообщество Чекпоинт">3. Сообщество «Чекпоинт»</option>
          <option value="Телевидение или СМИ">4. Телевидение или СМИ</option>
          <option value="Посоветовала родственница">5. Посоветовала жена, мама или другая родственница</option>
          <option value="Посоветовал друг или участник">6. Посоветовал друг или участник клуба</option>
          <option value="Мероприятие или выступление">7. Мероприятие или выступление</option>
          <option value="Нашёл в интернете">8. Нашёл в интернете</option>
          <option value="other">9. Другое (впишите)</option>
        </select>
      </div>
      
      <!-- Поле для "Другое" (скрыто по умолчанию) -->
      <div class="form-group" id="other-source-group" style="display: none;">
        <label>Укажите ваш вариант *</label>
        <input type="text" id="app-source-other" class="form-control" placeholder="Напишите ваш вариант">
      </div>

      <div class="form-group" style="display: flex; gap: 10px; align-items: flex-start; margin-top: 20px;">
        <input type="checkbox" id="app-consent" style="margin-top: 5px;">
        <label for="app-consent" style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">
          Я даю согласие на обработку персональных данных в соответствии с <a href="stub.html" target="_blank">Политикой конфиденциальности</a> и принимаю <a href="stub.html" target="_blank">Пользовательское соглашение</a>.
        </label>
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="submitApplication()">Отправить заявку</button>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function toggleOtherSource() {
      const select = document.getElementById('app-source');
      const otherGroup = document.getElementById('other-source-group');
      if (select.value === 'other') {
        otherGroup.style.display = 'block';
      } else {
        otherGroup.style.display = 'none';
      }
    }

    function submitApplication() {
      const firstName = document.getElementById('app-firstName').value;
      const lastName = document.getElementById('app-lastName').value;
      const age = document.getElementById('app-age').value;
      const city = document.getElementById('app-city').value;
      const nickname = document.getElementById('app-nickname').value;
      const email = document.getElementById('app-email').value;
      const phone = document.getElementById('app-phone').value;
      let source = document.getElementById('app-source').value;
      const consent = document.getElementById('app-consent').checked;

      if (source === 'other') {
        source = document.getElementById('app-source-other').value;
        if (!source) return alert('Пожалуйста, укажите свой вариант.');
      }

      if (!firstName || !lastName || !age || !city || !nickname || !email || !phone || !source) {
        return alert('Пожалуйста, заполните все поля.');
      }
      if (!consent) {
        return alert('Необходимо согласие на обработку данных.');
      }

      const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      apps.push({
        id: Date.now(),
        firstName, lastName, age, city, nickname, email, phone, source,
        status: 'pending',
        date: new Date().toLocaleDateString('ru-RU')
      });
      localStorage.setItem('gart_applications', JSON.stringify(apps));

      document.getElementById('form-card').innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <h3 style="color: var(--accent); margin-bottom: 15px;">Заявка отправлена!</h3>
          <p>Ожидайте решения координатора.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
