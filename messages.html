<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сообщения — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px;">
    <h2>Сообщения</h2>
    <div class="chat-layout" style="margin-top: 20px;">
      <div class="chat-sidebar">
        <div class="chat-tabs">
          <div class="chat-tab active" id="tab-general" onclick="switchTab('general')">Чаты</div>
          <div class="chat-tab" id="tab-personal" onclick="switchTab('personal')">Личные</div>
        </div>
        <div id="sidebar-content" style="overflow-y: auto; flex:1;"></div>
        <div id="admin-add-topic" style="display:none; padding: 10px; border-top: 1px solid #333;">
          <button class="btn" style="width: 100%; padding: 8px; font-size: 12px;" onclick="addTopic()">+ Новая тема</button>
        </div>
      </div>
      <div class="chat-main">
        <div class="chat-header" id="chat-header">Выберите чат</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area" style="display: none;">
          <input type="text" id="msg-input" class="form-control" placeholder="Написать сообщение...">
          <button class="btn" onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    const user = GART_AUTH.getCurrentUser();
    const isAdmin = user && user.role === 'admin';

    let currentTab = 'general';
    let currentChatId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const startChatWith = urlParams.get('with');
    const prefillText = urlParams.get('text');

    // In-memory кеш + синхронизация с localStorage
    function loadMessages() {
      const raw = localStorage.getItem('gart_messages');
      let msgs;
      if (!raw) {
        msgs = JSON.parse(JSON.stringify(GART_DATA.initialMessages || {}));
        localStorage.setItem('gart_messages', JSON.stringify(msgs));
      } else {
        try { msgs = JSON.parse(raw); }
        catch (e) { msgs = {}; }
        if (typeof msgs !== 'object' || Array.isArray(msgs)) msgs = {};
      }
      return msgs;
    }

    function saveMessages(msgs) {
      localStorage.setItem('gart_messages', JSON.stringify(msgs));
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (startChatWith) {
        switchTab('personal');
        setTimeout(() => {
          openChat(`dm_${startChatWith}`);
          if (prefillText) document.getElementById('msg-input').value = prefillText;
        }, 50);
      } else {
        switchTab('general');
      }
      localStorage.setItem('gart_unread', '0');
      const badge = document.getElementById('msg-badge');
      if (badge) badge.style.display = 'none';
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-general').classList.remove('active');
      document.getElementById('tab-personal').classList.remove('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById('admin-add-topic').style.display = (tab === 'general' && isAdmin) ? 'block' : 'none';
      currentChatId = null;
      renderSidebar();
      document.getElementById('chat-header').innerText = 'Выберите чат';
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input-area').style.display = 'none';
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-content');
      const allMsgs = loadMessages();
      container.innerHTML = '';
      let rendered = 0;

      if (currentTab === 'general') {
        const topics = JSON.parse(localStorage.getItem('gart_chat_topics') || '[]');
        topics.forEach((t, idx) => {
          rendered++;
          const chatId = `topic_${t}`;
          const msgs = Array.isArray(allMsgs[chatId]) ? allMsgs[chatId] : [];
          const lastMsg = msgs[msgs.length - 1];
          const lastText = lastMsg ? `${escapeHtml(lastMsg.author)}: ${escapeHtml(String(lastMsg.text).substring(0, 20))}...` : 'Нет сообщений';
          const lastTime = lastMsg ? escapeHtml(lastMsg.date) : '';

          container.innerHTML += `
            <div class="chat-list-item" data-chat-id="${escapeHtml(chatId)}" onclick="openChat(this.dataset.chatId, this)" id="chat-item-${idx}">
              <div style="min-width:0;">
                <div style="color: #fff; font-weight: bold; margin-bottom: 5px;"># ${escapeHtml(t)}</div>
                <div style="font-size: 12px; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lastText}</div>
              </div>
              <div style="text-align: right; font-size: 12px; color: var(--text-muted); flex-shrink:0;">
                <div>${lastTime}</div>
                <div style="background: #333; padding: 2px 6px; border-radius: 10px; margin-top: 5px;">${msgs.length}</div>
                ${isAdmin ? `<span onclick="event.stopPropagation(); deleteTopicAt(${idx})" style="color:#F44336; font-size:12px; cursor:pointer; display:block; margin-top:5px;">Удалить</span>` : ''}
              </div>
            </div>
          `;
        });
      } else {
        const users = GART_DATA.users.filter(u => u.email !== user.email);
        const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
        const approved = apps.filter(a => a.status === 'approved');
        const pending = apps.filter(a => a.status === 'pending');
        const appContacts = isAdmin ? [...pending, ...approved] : approved;
        const allContacts = [...users, ...appContacts];
        const uniqueContacts = Array.from(new Map(allContacts.map(c => [c.nickname, c])).values());

        let i = 0;
        uniqueContacts.forEach(u => {
          const nick = u.nickname;
          if (!nick) return;
          const chatId = `dm_${nick}`;
          const msgs = Array.isArray(allMsgs[chatId]) ? allMsgs[chatId] : [];
          if (!isAdmin && msgs.length === 0) return;

          rendered++;
          const lastMsg = msgs[msgs.length - 1];
          const lastText = lastMsg ? escapeHtml(String(lastMsg.text).substring(0, 25)) + '...' : 'Нет сообщений';
          const lastTime = lastMsg ? escapeHtml(lastMsg.date) : '';

          container.innerHTML += `
            <div class="chat-list-item" data-chat-id="${escapeHtml(chatId)}" onclick="openChat(this.dataset.chatId, this)" id="chat-item-${i}">
              <div style="min-width:0;">
                <div style="color: #fff; font-weight: bold; margin-bottom: 5px;">${escapeHtml(nick)}</div>
                <div style="font-size: 12px; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lastText}</div>
              </div>
              <div style="font-size: 12px; color: var(--text-muted); flex-shrink:0;">${lastTime}</div>
            </div>
          `;
          i++;
        });
      }

      if (rendered === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-title">Пока пусто</div>
            <p style="font-size:13px;">Начните диалог — напишите первому</p>
          </div>`;
      }
    }

    function openChat(chatId, el) {
      if (!chatId) return;
      currentChatId = chatId;

      document.querySelectorAll('.chat-list-item').forEach(n => n.classList.remove('active'));
      if (el) el.classList.add('active');

      const headerEl = document.getElementById('chat-header');
      if (chatId.startsWith('dm_')) {
        const nick = chatId.replace('dm_', '');
        headerEl.innerHTML = `Диалог с <a href="user-profile.html?nickname=${encodeURIComponent(nick)}" style="color: var(--accent); text-decoration: underline;">${escapeHtml(nick)}</a>`;
      } else {
        headerEl.innerText = `# ${chatId.replace('topic_', '')}`;
      }

      document.getElementById('chat-input-area').style.display = 'flex';
      renderMessages();
      document.getElementById('msg-input').focus();
    }

    function renderMessages() {
      const allMsgs = loadMessages();
      const container = document.getElementById('chat-messages');
      const chatMsgs = Array.isArray(allMsgs[currentChatId]) ? allMsgs[currentChatId] : [];

      if (chatMsgs.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding:40px 20px; margin:auto;">
            <div class="empty-state-icon">✍️</div>
            <div class="empty-state-title">Тишина</div>
            <p style="font-size:13px;">Напишите первое сообщение</p>
          </div>`;
        return;
      }

      container.innerHTML = chatMsgs.map((m, index) => {
        const isMine = m.author === user.nickname;
        const wrapperClass = isMine ? 'mine' : 'other';
        const bubbleClass = isMine ? 'msg-mine' : 'msg-other';
        return `
          <div class="msg-wrapper ${wrapperClass}">
            <div class="msg-bubble ${bubbleClass}">
              <div style="font-size: 11px; margin-bottom: 4px; font-weight: 600;">
                ${isMine
                  ? `<span style="opacity: 0.7;">${escapeHtml(m.author)}</span>`
                  : `<a href="user-profile.html?nickname=${encodeURIComponent(m.author)}" style="color: inherit; text-decoration: underline; opacity: 0.85;">${escapeHtml(m.author)}</a>`}
              </div>
              <div>${escapeHtml(m.text)}</div>
              <div style="font-size: 10px; text-align: right; margin-top: 6px; opacity: 0.65;">${escapeHtml(m.date)}</div>
            </div>
            ${isAdmin ? `<button class="msg-delete-btn" onclick="deleteMsg(${index})">Удалить</button>` : ''}
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const allMsgs = loadMessages();
      if (!Array.isArray(allMsgs[currentChatId])) allMsgs[currentChatId] = [];
      allMsgs[currentChatId].push({
        author: user.nickname,
        text: text,
        date: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})
      });
      saveMessages(allMsgs);

      input.value = '';
      renderMessages();
      renderSidebar();
      // сохраняем подсветку активного чата после re-render
      document.querySelectorAll('.chat-list-item').forEach(n => {
        if (n.dataset.chatId === currentChatId) n.classList.add('active');
      });
    }

    function addTopic() {
      const name = prompt('Введите название темы:');
      if (!name || !name.trim()) return;
      const topics = JSON.parse(localStorage.getItem('gart_chat_topics') || '[]');
      topics.push(name.trim());
      localStorage.setItem('gart_chat_topics', JSON.stringify(topics));
      renderSidebar();
      showToast('Тема добавлена');
    }

    function deleteTopicAt(idx) {
      if (!confirm('Удалить тему?')) return;
      const topics = JSON.parse(localStorage.getItem('gart_chat_topics') || '[]');
      topics.splice(idx, 1);
      localStorage.setItem('gart_chat_topics', JSON.stringify(topics));
      currentChatId = null;
      renderSidebar();
      document.getElementById('chat-header').innerText = 'Выберите чат';
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input-area').style.display = 'none';
      showToast('Тема удалена', 'info');
    }

    function deleteMsg(index) {
      if (!confirm('Удалить сообщение?')) return;
      const allMsgs = loadMessages();
      if (Array.isArray(allMsgs[currentChatId])) {
        allMsgs[currentChatId].splice(index, 1);
        saveMessages(allMsgs);
        renderMessages();
        renderSidebar();
        document.querySelectorAll('.chat-list-item').forEach(n => {
          if (n.dataset.chatId === currentChatId) n.classList.add('active');
        });
      }
    }
  </script>
</body>
</html>
