<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сообщения — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px;">
    <h2>Сообщения</h2>
    
    <div class="chat-layout" style="margin-top: 20px;">
      <div class="chat-sidebar">
        <div class="chat-tabs">
          <div class="chat-tab active" id="tab-general" onclick="switchTab('general')">Чаты</div>
          <div class="chat-tab" id="tab-personal" onclick="switchTab('personal')">Личные</div>
        </div>
        <div id="sidebar-content" style="overflow-y: auto; flex:1;"></div>
        <div id="admin-add-topic" style="display:none; padding: 10px; border-top: 1px solid #333;">
          <button class="btn" style="width: 100%; padding: 5px; font-size: 12px;" onclick="addTopic()">+ Новая тема</button>
        </div>
      </div>

      <div class="chat-main">
        <div class="chat-header" id="chat-header">Выберите чат</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area" style="display: none;">
          <input type="text" id="msg-input" class="form-control" placeholder="Написать сообщение...">
          <button class="btn" onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    let currentTab = 'general';
    let currentChatId = null;
    const user = GART_AUTH.getCurrentUser();
    const isAdmin = user && user.role === 'admin';

    const urlParams = new URLSearchParams(window.location.search);
    const startChatWith = urlParams.get('with');
    const prefillText = urlParams.get('text');

    document.addEventListener('DOMContentLoaded', () => {
      if (startChatWith) {
        currentTab = 'personal';
        switchTab('personal');
        setTimeout(() => {
          openChat(`dm_${startChatWith}`);
          if (prefillText) document.getElementById('msg-input').value = prefillText;
        }, 100);
      } else {
        switchTab('general');
      }
      localStorage.setItem('gart_unread', '0');
      const badge = document.getElementById('msg-badge');
      if (badge) badge.style.display = 'none';
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-general').classList.remove('active');
      document.getElementById('tab-personal').classList.remove('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById('admin-add-topic').style.display = (tab === 'general' && isAdmin) ? 'block' : 'none';
      renderSidebar();
      document.getElementById('chat-header').innerText = 'Выберите чат';
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input-area').style.display = 'none';
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-content');
      container.innerHTML = '';
      const allMsgs = JSON.parse(localStorage.getItem('gart_messages') || '{}');

      if (currentTab === 'general') {
        const topics = JSON.parse(localStorage.getItem('gart_chat_topics') || '[]');
        topics.forEach(t => {
          const msgs = allMsgs[`topic_${t}`] || [];
          const lastMsg = msgs[msgs.length - 1];
          const lastText = lastMsg ? `${lastMsg.author}: ${lastMsg.text.substring(0, 20)}...` : 'Нет сообщений';
          const lastTime = lastMsg ? lastMsg.date : '';

          container.innerHTML += `
            <div class="chat-list-item" onclick="openChat('topic_${t}')" id="list-topic_${t}">
              <div>
                <div style="color: #fff; font-weight: bold; margin-bottom: 5px;"># ${t}</div>
                <div style="font-size: 12px; color: var(--text-muted);">${lastText}</div>
              </div>
              <div style="text-align: right; font-size: 12px; color: var(--text-muted);">
                <div>${lastTime}</div>
                <div style="background: #333; padding: 2px 6px; border-radius: 10px; margin-top: 5px;">${msgs.length}</div>
                ${isAdmin ? `<span onclick="event.stopPropagation(); deleteTopic('${t}')" style="color:#F44336; font-size:12px; cursor:pointer; display:block; margin-top:5px;">Удалить</span>` : ''}
              </div>
            </div>
          `;
        });
      } else {
        // ЛОГИКА ДЛЯ ЛИЧНЫХ СООБЩЕНИЙ
        const users = GART_DATA.users.filter(u => u.email !== user.email);
        const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
        const approved = apps.filter(a => a.status === 'approved');
        const pending = apps.filter(a => a.status === 'pending');
        
        // Админ видит всех (approved + pending), остальные только approved
        const appContacts = isAdmin ? [...pending, ...approved] : approved;
        const allContacts = [...users, ...appContacts];

        // Убираем дубликаты по никнейму
        const uniqueContacts = Array.from(new Map(allContacts.map(c => [c.nickname, c])).values());

        uniqueContacts.forEach(u => {
          const nick = u.nickname;
          if (!nick) return;
          
          const chatId = `dm_${nick}`;
          const msgs = allMsgs[chatId] || [];
          const lastMsg = msgs[msgs.length - 1];
          
          // Показываем всех админу, остальным - только тех, с кем уже есть переписка
          if (isAdmin || msgs.length > 0) {
            const lastText = lastMsg ? lastMsg.text.substring(0, 25) + '...' : 'Нет сообщений';
            const lastTime = lastMsg ? lastMsg.date : '';

            container.innerHTML += `
              <div class="chat-list-item" onclick="openChat('${chatId}')" id="list-${chatId}">
                <div>
                  <div style="color: #fff; font-weight: bold; margin-bottom: 5px;">${nick}</div>
                  <div style="font-size: 12px; color: var(--text-muted);">${lastText}</div>
                </div>
                <div style="font-size: 12px; color: var(--text-muted);">${lastTime}</div>
              </div>
            `;
          }
        });
      }
    }

    function openChat(chatId) {
      currentChatId = chatId;
      document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`list-${chatId}`);
      if (activeEl) activeEl.classList.add('active');

      const headerEl = document.getElementById('chat-header');
      if (chatId.startsWith('dm_')) {
        const nick = chatId.replace('dm_', '');
        headerEl.innerHTML = `Диалог с <a href="user-profile.html?nickname=${encodeURIComponent(nick)}" style="color: var(--accent); text-decoration: underline;">${nick}</a>`;
      } else {
        headerEl.innerText = chatId.replace('topic_', '# ');
      }
      
      document.getElementById('chat-input-area').style.display = 'flex';
      renderMessages();
    }

    function renderMessages() {
      const allMsgs = JSON.parse(localStorage.getItem('gart_messages') || '{}');
      const chatMsgs = allMsgs[currentChatId] || [];
      const container = document.getElementById('chat-messages');
      
      container.innerHTML = chatMsgs.map((m, index) => `
        <div class="msg-bubble ${m.author === user.nickname ? 'msg-mine' : 'msg-other'}">
          <div style="font-size: 10px; margin-bottom: 3px;">
            ${m.author === user.nickname 
              ? `<span style="opacity: 0.7;">${m.author}</span>` 
              : `<a href="user-profile.html?nickname=${encodeURIComponent(m.author)}" style="color: inherit; text-decoration: underline; opacity: 0.8;">${m.author}</a>`}
          </div>
          ${m.text}
          ${isAdmin ? `<button onclick="deleteMsg(${index})" style="background:none; border:none; color:red; font-size:12px; cursor:pointer; float:right; margin-left:10px;">&times;</button>` : ''}
          <div style="font-size: 10px; text-align: right; margin-top: 5px; opacity: 0.5;">${m.date}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      let allMsgs = JSON.parse(localStorage.getItem('gart_messages') || '{}');
      if (!allMsgs[currentChatId]) allMsgs[currentChatId] = [];
      
      allMsgs[currentChatId].push({ 
        author: user.nickname, 
        text: text,
        date: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})
      });
      
      localStorage.setItem('gart_messages', JSON.stringify(allMsgs));
      input.value = '';
      renderMessages();
      renderSidebar();
    }

    function addTopic() {
      const name = prompt('Введите название темы:');
      if (!name) return;
      let topics = JSON.parse(localStorage.getItem('gart_chat_topics'));
      topics.push(name);
      localStorage.setItem('gart_chat_topics', JSON.stringify(topics));
      renderSidebar();
    }

    function deleteTopic(name) {
      if (!confirm('Удалить тему?')) return;
      let topics = JSON.parse(localStorage.getItem('gart_chat_topics'));
      topics = topics.filter(t => t !== name);
      localStorage.setItem('gart_chat_topics', JSON.stringify(topics));
      renderSidebar();
    }

    function deleteMsg(index) {
      if (!confirm('Удалить сообщение?')) return;
      let allMsgs = JSON.parse(localStorage.getItem('gart_messages') || '{}');
      if (allMsgs[currentChatId]) {
        allMsgs[currentChatId].splice(index, 1);
        localStorage.setItem('gart_messages', JSON.stringify(allMsgs));
        renderMessages();
        renderSidebar();
      }
    }
  </script>
</body>
</html>
