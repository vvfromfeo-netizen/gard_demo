<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — Админка ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="admin">
  <main class="container" style="margin-top: 40px;">
    <h2 style="margin-bottom: 30px;">Входящие заявки (На рассмотрении)</h2>
    
    <div id="applications-list" class="grid"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function renderApplications() {
      const allApps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      const pendingApps = allApps.filter(a => a.status === 'pending');
      
      const container = document.getElementById('applications-list');

      if (pendingApps.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Нет новых заявок на рассмотрении.</p>';
        return;
      }

      container.innerHTML = pendingApps.map(app => `
        <div class="card" style="border-left: 4px solid var(--accent);">
          <h3 style="margin-bottom: 15px;">${escapeHtml(app.firstName)} ${escapeHtml(app.lastName)}</h3>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Никнейм: <a href="user-profile.html?nickname=${encodeURIComponent(app.nickname)}" style="color: var(--accent); font-weight: bold; text-decoration: underline;">${escapeHtml(app.nickname)}</a></p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Возраст: <span style="color:#fff">${escapeHtml(app.age)} лет</span></p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Город: <span style="color:#fff">${escapeHtml(app.city || 'Не указан')}</span></p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Email: <span style="color:#fff">${escapeHtml(app.email)}</span></p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Тел: <span style="color:#fff">${escapeHtml(app.phone)}</span></p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Источник: <span style="color:#fff">${escapeHtml(app.source || 'Не указан')}</span></p>
          
          <a href="messages.html?with=${encodeURIComponent(app.nickname)}" class="btn btn-outline" style="width: 100%; margin-bottom: 10px; border-color: #2196F3; color: #2196F3; display: block; text-align: center;">Начать переписку</a>
          
          <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="changeStatus(${app.id}, 'approved')">Одобрить</button>
          <button class="btn btn-outline" style="width: 100%;" onclick="changeStatus(${app.id}, 'rejected')">Отклонить</button>
        </div>
      `).join('');
    }

    function changeStatus(id, newStatus) {
      const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      const index = apps.findIndex(a => a.id === id);
      if (index !== -1) {
        apps[index].status = newStatus;
        localStorage.setItem('gart_applications', JSON.stringify(apps));
        renderApplications();
      }
    }

    document.addEventListener('DOMContentLoaded', renderApplications);
  </script>
</body>
</html>
