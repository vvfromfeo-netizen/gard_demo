<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — Админка ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="admin">
  <main class="container" style="margin-top: 40px;">
    <h2 style="margin-bottom: 30px;">Входящие заявки (На рассмотрении)</h2>
    
    <div id="applications-list" class="grid"></div>

    <h2 style="margin-top: 60px; margin-bottom: 20px; color: #4CAF50;">Последние донаты</h2>
    <div class="card">
      <table style="width: 100%; text-align: left; border-collapse: collapse;">
        <thead>
          <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
            <th style="padding: 10px 0;">Имя</th>
            <th style="padding: 10px 0;">Сумма</th>
            <th style="padding: 10px 0;">Email</th>
            <th style="padding: 10px 0;">Дата</th>
          </tr>
        </thead>
        <tbody id="donations-list"></tbody>
      </table>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function renderApplications() {
      const allApps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      const pendingApps = allApps.filter(a => a.status === 'pending');
      
      const container = document.getElementById('applications-list');
      container.innerHTML = '';

      if (pendingApps.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Нет новых заявок на рассмотрении.</p>';
        return;
      }

      pendingApps.forEach(app => {
        container.innerHTML += `
          <div class="card" style="border-left: 4px solid var(--accent);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
              <h3>${app.name}</h3>
            </div>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Никнейм: <span style="color:var(--accent); font-weight:bold;">${app.nickname || 'Не указан'}</span></p>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Email: <span style="color:#fff">${app.email}</span></p>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Тел: <span style="color:#fff">${app.phone}</span></p>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Регион: <span style="color:#fff">${app.region}</span></p>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Источник: <span style="color:#fff">${app.source}</span></p>
            
            <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="changeStatus(${app.id}, 'approved')">Одобрить</button>
            <button class="btn btn-outline" style="width: 100%;" onclick="changeStatus(${app.id}, 'rejected')">Отклонить</button>
          </div>
        `;
      });
    }

    function changeStatus(id, newStatus) {
      const apps = JSON.parse(localStorage.getItem('gart_applications') || '[]');
      const index = apps.findIndex(a => a.id === id);
      if (index !== -1) {
        apps[index].status = newStatus;
        localStorage.setItem('gart_applications', JSON.stringify(apps));
        renderApplications();
      }
    }

    function renderDonations() {
      const donations = JSON.parse(localStorage.getItem('gart_donations') || '[]');
      const tbody = document.getElementById('donations-list');
      if (donations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding: 15px 0; color: var(--text-muted);">Пока нет донатов.</td></tr>';
        return;
      }
      tbody.innerHTML = [...donations].reverse().map(d => `
        <tr style="border-bottom: 1px solid #222;">
          <td style="padding: 12px 0; color: #fff;">${d.name}</td>
          <td style="padding: 12px 0; color: var(--accent); font-weight: bold;">${d.amount} ₽</td>
          <td style="padding: 12px 0; color: var(--text-muted);">${d.email}</td>
          <td style="padding: 12px 0; color: #777; font-size: 12px;">${d.date}</td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderApplications();
      renderDonations();
    });
  </script>
</body>
</html>
