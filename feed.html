<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента сообщества — ГАРТ</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-require="member">
  <main class="container" style="margin-top: 40px; max-width: 800px;">
    <h2>Внутренняя площадка</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Общение участников клуба. Только для своих.</p>

    <div class="card" style="margin-bottom: 40px; border-color: var(--accent);">
      <h3>Создать публикацию</h3>
      <div class="form-group" style="margin-top: 15px;">
        <textarea id="new-post-text" class="form-control" rows="3" placeholder="Поделитесь новостью или задайте вопрос..."></textarea>
      </div>
      <button class="btn" onclick="createPost()">Опубликовать</button>
    </div>

    <div id="posts-container"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    function renderPosts() {
      const allPosts = JSON.parse(localStorage.getItem('gart_posts') || '[]');
      const user = GART_AUTH.getCurrentUser();
      const isAdmin = user && user.role === 'admin';
      
      const visiblePosts = isAdmin ? allPosts : allPosts.filter(p => !p.hidden);
      
      const container = document.getElementById('posts-container');
      
      if (visiblePosts.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Пока нет публикаций.</p>';
        return;
      }

      container.innerHTML = [...visiblePosts].reverse().map(post => {
        const comments = (post.comments || []).filter(c => isAdmin || !c.hidden);
        let commentsHTML = '';
        
        if (comments.length > 0) {
          const lastComment = comments[comments.length - 1];
          commentsHTML = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #222;" id="comments-${post.id}">
              <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Комментарии (${comments.length}):</p>
              
              <div class="hidden-comments" id="hidden-${post.id}" style="display: none; margin-bottom: 15px;">
                ${comments.slice(0, -1).map(c => `
                  <div style="margin-bottom: 10px; font-size: 14px; padding-left: 10px; border-left: 2px solid #333; opacity: ${c.hidden ? '0.4' : '1'};">
                    <a href="user-profile.html?nickname=${encodeURIComponent(c.author)}" style="color:#fff; text-decoration: underline;">${c.author}</a>: ${c.text}
                    ${isAdmin ? `<button onclick="hideComment(${post.id}, '${c.text}')" style="background:transparent; border:none; color:#F44336; cursor:pointer; font-size:12px; margin-left:10px;">Скрыть</button>` : ''}
                  </div>
                `).join('')}
              </div>

              <div style="margin-bottom: 15px; font-size: 14px; background: #1a1a1a; padding: 10px; border-left: 2px solid var(--accent); opacity: ${lastComment.hidden ? '0.4' : '1'};">
                <a href="user-profile.html?nickname=${encodeURIComponent(lastComment.author)}" style="color:#fff; text-decoration: underline;">${lastComment.author}</a>: ${lastComment.text}
                ${isAdmin ? `<button onclick="hideComment(${post.id}, '${lastComment.text}')" style="background:transparent; border:none; color:#F44336; cursor:pointer; font-size:12px; margin-left:10px;">Скрыть</button>` : ''}
              </div>

              ${comments.length > 1 ? `
                <button class="btn btn-outline" style="font-size: 12px; padding: 5px 10px; margin-bottom: 10px;" onclick="toggleComments(${post.id})" id="btn-toggle-${post.id}">
                  Показать все
                </button>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="card" style="opacity: ${post.hidden ? '0.4' : '1'}; border: 1px solid ${post.hidden ? '#F44336' : 'var(--border-color)'};">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
              <a href="user-profile.html?nickname=${encodeURIComponent(post.author)}" style="color: #fff; font-size: 18px; font-family: var(--font-heading); text-decoration: underline;">${post.author}</a>
              <div>
                <span style="color: var(--text-muted); font-size: 14px;">${post.date}</span>
                ${isAdmin ? `<button onclick="hidePost(${post.id})" style="background:#F44336; color:#fff; border:none; padding:2px 8px; margin-left:10px; font-size:12px; border-radius:3px; cursor:pointer;">${post.hidden ? 'Восстановить' : 'Скрыть'}</button>` : ''}
              </div>
            </div>
            
            <p style="font-size: 16px; margin-bottom: 15px;">${post.text}</p>
            
            ${commentsHTML}

            <div style="display: flex; gap: 10px; margin-top: 15px;">
              <input type="text" id="input-comment-${post.id}" class="form-control" placeholder="Ваш комментарий..." style="padding: 8px;">
              <button class="btn" style="padding: 8px 15px;" onclick="addComment(${post.id})">Ответить</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function hidePost(id) {
      let posts = JSON.parse(localStorage.getItem('gart_posts'));
      const index = posts.findIndex(p => p.id === id);
      if (index !== -1) {
        posts[index].hidden = !posts[index].hidden;
        localStorage.setItem('gart_posts', JSON.stringify(posts));
        renderPosts();
      }
    }

    function hideComment(postId, commentText) {
      let posts = JSON.parse(localStorage.getItem('gart_posts'));
      const postIndex = posts.findIndex(p => p.id === postId);
      if (postIndex !== -1) {
        const commentIndex = posts[postIndex].comments.findIndex(c => c.text === commentText);
        if (commentIndex !== -1) {
          posts[postIndex].comments[commentIndex].hidden = !posts[postIndex].comments[commentIndex].hidden;
          localStorage.setItem('gart_posts', JSON.stringify(posts));
          renderPosts();
        }
      }
    }

    function toggleComments(postId) {
      const hiddenBlock = document.getElementById(`hidden-${postId}`);
      const btn = document.getElementById(`btn-toggle-${postId}`);
      if (hiddenBlock.style.display === 'none') {
        hiddenBlock.style.display = 'block';
        btn.innerText = 'Скрыть';
      } else {
        hiddenBlock.style.display = 'none';
        btn.innerText = 'Показать все';
      }
    }

    function createPost() {
      const text = document.getElementById('new-post-text').value.trim();
      if (!text) return alert('Введите текст');

      const user = GART_AUTH.getCurrentUser();
      const posts = JSON.parse(localStorage.getItem('gart_posts') || '[]');
      
      posts.push({ id: Date.now(), author: user.nickname, text: text, date: new Date().toLocaleDateString('ru-RU'), comments: [], hidden: false });
      localStorage.setItem('gart_posts', JSON.stringify(posts));
      document.getElementById('new-post-text').value = '';
      renderPosts();
    }

    function addComment(postId) {
      const input = document.getElementById(`input-comment-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const user = GART_AUTH.getCurrentUser();
      let posts = JSON.parse(localStorage.getItem('gart_posts'));
      
      const postIndex = posts.findIndex(p => p.id === postId);
      if (postIndex !== -1) {
        if (!posts[postIndex].comments) posts[postIndex].comments = [];
        posts[postIndex].comments.push({ author: user.nickname, text: text, hidden: false });
        localStorage.setItem('gart_posts', JSON.stringify(posts));
        renderPosts();
      }
    }

    document.addEventListener('DOMContentLoaded', renderPosts);
  </script>
</body>
</html>
